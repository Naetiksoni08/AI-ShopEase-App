# -----------------------------------------------------------------------
# docker-compose.yml — runs backend + frontend together for LOCAL testing
# -----------------------------------------------------------------------
# Place this file at your project ROOT (one level above Backend/ and
# Frontend/ folders), so the `context` paths below resolve correctly.
#
# Run with:   docker compose up --build
# Stop with:  docker compose down
# -----------------------------------------------------------------------

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.backend
    container_name: shopease-backend
    # NOTE: no "ports:" mapping anymore — the backend is no longer
    # reachable from your host machine directly (try hitting
    # localhost:5001 after this change, it will fail — that's expected).
    # It's still reachable from OTHER containers on this compose network,
    # by its service name "backend", which is exactly what nginx uses.
    env_file:
      - ./Backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.frontend
      args:
        # Empty on purpose: the browser now calls a RELATIVE path like
        # "/api/product" instead of an absolute URL like
        # "http://localhost:5001/api/product". A relative path always
        # resolves against whatever origin the page was loaded from —
        # so it automatically works whether that's localhost today or
        # your real domain later on EC2, with zero code changes.
        VITE_API_URL: ""
    container_name: shopease-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped