server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # This is the key line for React Router (SPA) apps:
    # try to serve the exact file requested; if it doesn't exist,
    # fall back to index.html and let React Router handle the routing
    # client-side. Without this, direct navigation/refresh on routes
    # like /product/123/show would return a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}