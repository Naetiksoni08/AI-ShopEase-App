server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # REVERSE PROXY: anything starting with /api goes to the backend
    # container instead of being treated as a static file.
    #
    # "backend" here is NOT a real hostname on the internet — it's the
    # service name from docker-compose.yml. Docker Compose automatically
    # creates internal DNS so containers can reach each other by service
    # name over a private network. Port 5001 is the backend's internal
    # port — it does NOT need to be published to the host anymore.
    #
    # No trailing slash after "backend:5001" is intentional: it means
    # nginx forwards the full path as-is (e.g. /api/product/123 stays
    # /api/product/123 when it reaches Express) — matching how your
    # backend routes are already mounted under /api.
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5001;

        # Standard headers so the backend sees real client info instead
        # of thinking every request came from the nginx container itself
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # REVERSE PROXY: /grafana goes to the grafana container, same idea
    # as /api above — "grafana" is the service name from
    # docker-compose.yml, port 3000 is grafana's default internal port.
    #
    # Trailing slash after "grafana:3000/" IS intentional here (unlike
    # /api above) — it strips the /grafana prefix before forwarding, so
    # grafana receives requests as if it were running at the root path,
    # which is what GF_SERVER_SERVE_FROM_SUB_PATH expects on its side.
    # ---------------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This is the key line for React Router (SPA) apps:
    # try to serve the exact file requested; if it doesn't exist,
    # fall back to index.html and let React Router handle the routing
    # client-side. Without this, direct navigation/refresh on routes
    # like /product/123/show would return a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
  
        # jenkins needs these extra headers for its own reverse-proxy
        # awareness, without them the UI can break/redirect wrong
        proxy_redirect http:// $scheme://;
        proxy_set_header Connection "";
        proxy_max_temp_file_size 0;
   }
}
    

   