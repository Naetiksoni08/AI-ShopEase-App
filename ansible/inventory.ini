# instance B — created by terraform, no elastic IP so the address
# changes on stop/start. refresh before running the playbook:
#   cd ../terraform && terraform output -raw public_ip

[shopease_poc]
32.236.201.50 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/naetik-devops.pem

[shopease_poc:vars]
ansible_python_interpreter=/usr/bin/python3

# instance A — actual prod server, not touched by this playbook
# (playbook.yml targets shopease_poc only). kept here for reference.

[shopease_prod]
52.64.235.225 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/naetik-devops.pem

[shopease_prod:vars]
ansible_python_interpreter=/usr/bin/python3